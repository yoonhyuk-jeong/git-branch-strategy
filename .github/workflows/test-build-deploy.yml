# v4 12절: test = workflow_dispatch (소스: test 브랜치)
# QA가 검증 시작 시점을 통제한다 — 검증 중 다른 기능이 test에 merge돼도 환경이 덮어써지지 않는다.
# 샌드박스용 더미 — 실제 배포 없이 build + 산출물 식별자 출력만 한다.
#
# 버전 규칙은 dev 와 동일: test 에는 릴리스 버전을 발급하지 않는다.
# QA가 봐야 할 것은 "몇 버전이냐"가 아니라 "무슨 기능이 올라와 있느냐"다 (v4 브랜치=칸반).
name: Test dispatch build & Deploy (dummy)

on:
  workflow_dispatch:
    # Actions 탭 > Run workflow 에서 배포할 브랜치를 선택해 수동 실행 (기본 소스 = test)

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # "master 대비 무엇이 올라갔나" 판독용 (v4 2절)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'

      # ── 빌드 환경 기록 ────────────────────────────────────────────────
      # JDK 를 고정하지 않는다. `java-version: '17'` 은 최신 패치로 해석되므로 실행 시점마다
      # 달라질 수 있고, 그건 CVE 패치를 계속 받기 위해 의도한 것이다.
      # 대신 무엇으로 빌드했는지를 남긴다 — digest 가 어긋났을 때 "JDK가 움직였나 / 소스가
      # 다른가"를 즉시 구분하기 위한 증적이다. 고정(prevention)이 아니라 감지(detection).
      - name: 빌드 환경 기록
        id: buildenv
        run: |
          VENDOR=$(java -XshowSettings:properties -version 2>&1 | grep -m1 'java.vendor =' | sed 's/.*= *//')
          BUILD=$(java -version 2>&1 | sed -n '2p' | sed -E 's/.*\(build ([^)]*)\).*/\1/')
          GRADLE=$(sed -n 's|.*gradle-\([0-9.]*\)-bin.zip|\1|p' gradle/wrapper/gradle-wrapper.properties)
          echo "jdk=${VENDOR} ${BUILD}" >> "$GITHUB_OUTPUT"
          echo "gradle=${GRADLE}"       >> "$GITHUB_OUTPUT"
          echo "JDK: ${VENDOR} ${BUILD} / Gradle: ${GRADLE}"

      # v4 3절: test 환경 배포 소스는 test 브랜치로 고정하는 것이 기본.
      # 예외(감사 요건상 release 후보 스모크)는 경고만 남기고 통과시킨다.
      - name: Warn if source is not the test branch
        if: github.ref_name != 'test'
        run: |
          echo "::warning title=비표준 소스::test 환경 기본 소스는 'test' 브랜치입니다 (현재: ${GITHUB_REF_NAME}). release 후보 스모크라면 종료 후 test 브랜치를 재배포하세요 (v4 3절)."

      - name: Build
        run: ./gradlew build --no-daemon

      - name: 산출물 digest 산출
        id: artifact
        run: |
          JAR=$(ls build/libs/*.jar | head -1)
          echo "digest=sha256:$(sha256sum "$JAR" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Deploy (dummy) — 주입 실행
        env:
          APP_ENV: test
          APP_VERSION: sha-${{ github.sha }}
          APP_COMMIT: ${{ github.sha }}
          APP_DIGEST: ${{ steps.artifact.outputs.digest }}
        run: |
          {
            echo 'APP_OUTPUT<<__EOF__'
            java -cp build/classes/java/main:build/resources/main com.ti.Main
            echo '__EOF__'
          } >> "$GITHUB_ENV"

      - name: Step summary
        env:
          DIGEST: ${{ steps.artifact.outputs.digest }}
          JDK: ${{ steps.buildenv.outputs.jdk }}
        run: |
          echo "::notice title=TEST deploy::env=test ref=${GITHUB_REF_NAME} image=ti-server:sha-${GITHUB_SHA::7} digest=${DIGEST}"
          {
            echo "## 🟡 TEST 배포 (dummy) — QA 게이트 + 배포 대기실"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| 트리거 | \`workflow_dispatch\` (QA가 시점 통제) |"
            echo "| 소스 브랜치 | \`${GITHUB_REF_NAME}\` |"
            echo "| 이미지 태그 | \`ti-server:sha-${GITHUB_SHA::7}\` — **버전 없음** (릴리스 대상이 아니다) |"
            echo "| digest | \`${DIGEST}\` |"
            echo "| 커밋 | [\`${GITHUB_SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |"
            echo "| 빌드 JDK | \`${JDK}\` |"
            echo ""
            echo "### 실행 중인 앱"
            echo '```'
            echo "${APP_OUTPUT}"
            echo '```'
            echo ""
            echo "### 이 배포에 들어있는 기능 (master 대비)"
            echo '```'
            git log --merges --oneline "${GITHUB_SHA}" --not origin/master || echo "(master 대비 추가 merge 없음)"
            echo '```'
            echo "> QA 통과해도 배포일이 미정이면 여기 머문다. 배포 확정분만 \`release-{MMDD}\` 로 간다."
          } >> "$GITHUB_STEP_SUMMARY"
