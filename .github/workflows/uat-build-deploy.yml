# v4 12절: uat = workflow_dispatch (소스: release-{날짜} 또는 fast path feature)
#   v3의 "release push 자동" 목표는 폐기됨 — release가 여러 개 열려 있을 때 검증 중인 UAT를 덮어쓰기 때문.
# 샌드박스용 더미 — 실제 배포 없이 build + 버전/digest 산출 + rc 태그 부착만 한다.
#
# ── 버전 관리 규칙 (UAT) ────────────────────────────────────────────────
# UAT에 올라간 것은 "prod에 나갈 후보(Release Candidate)"다. 그래서:
#   1) conventional-changelog-action 을 **계산 전용**으로 돌려 "이대로 나가면 몇 버전인가"를 뽑고
#   2) 그 값으로 annotated 태그 `uat-v{version}-rc.{n}` 을 release 브랜치 HEAD에 붙인다.
#
# 왜 안전한가: 버전 계산기(git-semver-tags)는 **HEAD에서 도달 가능한 최신 태그**만 본다.
# v4 금지규칙 3에 의해 release-* 는 master에 merge되지 않으므로, 여기 붙인 태그는
# master에서 영원히 도달 불가 → prod 버전 계산을 오염시킬 수 없다.
# 추가 안전장치 2개: (a) prefix가 `uat-v` 라 tag-prefix `v` 와 안 겹친다
#                    (b) git-semver-tags는 skipUnstable=true 라 `-rc.N` 같은 pre-release를 건너뛴다
name: UAT dispatch build & Deploy (dummy)

on:
  workflow_dispatch:

# rc 태그를 push 해야 하므로 write 필요
permissions:
  contents: write

# UAT는 단일 환경 — 한 번에 하나의 release만 점유 (v4 5절 3단계)
concurrency:
  group: uat-environment
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 태그 전체가 있어야 버전 계산이 맞는다

      # v4 3절: UAT 소스는 release-{날짜} 가 기본. 목적지 브랜치를 직접 올리는 것은 금지.
      - name: Guard — 소스 브랜치 검증
        run: |
          case "${GITHUB_REF_NAME}" in
            release-*)
              echo "✅ 조립대 브랜치 — 정상 경로" ;;
            master|test|dev)
              echo "::error title=금지된 소스::'${GITHUB_REF_NAME}' 은 목적지 브랜치입니다. UAT에는 release-{MMDD} 를 올리세요 (v4 금지규칙 3)."
              exit 1 ;;
            *)
              echo "::warning title=fast path::단건 feature '${GITHUB_REF_NAME}' 직행입니다. 묶음 배포라면 release-{MMDD} 로 조립하세요." ;;
          esac

      # v4 12절 보조 권장: "master ancestor 확인" 가드 — 낡은 브랜치 배포 방지.
      - name: Guard — master ancestor 확인
        run: |
          if git merge-base --is-ancestor origin/master "${GITHUB_SHA}"; then
            echo "✅ master가 ancestor — UAT 트리 = master + 이 기능들"
          else
            echo "::error title=낡은 소스::${GITHUB_REF_NAME} 에 최신 master가 반영되지 않았습니다. 로컬에서 'git merge master' 후 다시 dispatch하세요 (v4 8절)."
            exit 1
          fi

      - name: Install changelog config dependencies
        # v8부터 ESM 전용으로 전환되어 require()가 실패하므로, CommonJS를 지원하는 마지막 버전(7.0.2)으로 고정한다.
        run: npm install --no-save conventional-changelog-conventionalcommits@7.0.2

      # ★ 계산 전용 ★ — 커밋도, 태그도, 파일 수정도 하지 않는다.
      #   release 브랜치에 커밋이 나가면 v4 금지규칙 6(release 직접 커밋 금지) 위반이다.
      #   skip-commit: true 이면 액션은 version-file 대신 **git 태그**로 현재 버전을 판정한다
      #   → 기준점이 "직전 prod 릴리스 태그(v*)" 가 되어, prod와 같은 규칙으로 계산된다.
      - name: 다음 릴리스 버전 예측 (계산 전용)
        id: changelog
        uses: TriPSs/conventional-changelog-action@v3
        with:
          skip-commit: 'true'
          skip-tag: 'true'
          skip-version-file: 'true'
          git-push: 'false'
          output-file: 'false'
          skip-git-pull: 'true'    # fetch-depth:0 로 이미 전체를 받았다
          skip-on-empty: 'false'   # feat/fix 가 없어도 UAT는 배포되어야 하므로 버전을 뽑는다
          fallback-version: '1.0.0'
          config-file-path: .github/changelog-config.cjs

      # 같은 버전으로 UAT를 몇 번 올렸는지 = rc 회차. 재조립(release-0818-v2)이면 rc.2 가 된다.
      - name: rc 회차 결정
        id: rc
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
          CHANGES: ${{ steps.changelog.outputs.changelog }}
        run: |
          git fetch --tags --force --quiet
          N=$(git tag -l "uat-v${VERSION}-rc.*" | wc -l | tr -d ' ')
          RC=$((N + 1))
          TAG="uat-v${VERSION}-rc.${RC}"
          echo "version=${VERSION}"     >> "$GITHUB_OUTPUT"
          echo "rc_tag=${TAG}"          >> "$GITHUB_OUTPUT"
          echo "image_tag=v${VERSION}-rc.${RC}" >> "$GITHUB_OUTPUT"
          echo "예측 버전: ${VERSION} / 이번 rc 태그: ${TAG}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'

      # ── 빌드 환경 기록 ────────────────────────────────────────────────
      # JDK 를 고정하지 않는다. `java-version: '17'` 은 최신 패치로 해석되므로 실행 시점마다
      # 달라질 수 있고, 그건 CVE 패치를 계속 받기 위해 의도한 것이다.
      # 대신 무엇으로 빌드했는지를 남긴다 — digest 가 어긋났을 때 "JDK가 움직였나 / 소스가
      # 다른가"를 즉시 구분하기 위한 증적이다. 고정(prevention)이 아니라 감지(detection).
      - name: 빌드 환경 기록
        id: buildenv
        run: |
          VENDOR=$(java -XshowSettings:properties -version 2>&1 | grep -m1 'java.vendor =' | sed 's/.*= *//')
          BUILD=$(java -version 2>&1 | sed -n '2p' | sed -E 's/.*\(build ([^)]*)\).*/\1/')
          GRADLE=$(sed -n 's|.*gradle-\([0-9.]*\)-bin.zip|\1|p' gradle/wrapper/gradle-wrapper.properties)
          echo "jdk=${VENDOR} ${BUILD}" >> "$GITHUB_OUTPUT"
          echo "gradle=${GRADLE}"       >> "$GITHUB_OUTPUT"
          echo "JDK: ${VENDOR} ${BUILD} / Gradle: ${GRADLE}"

      - name: Build
        run: ./gradlew build --no-daemon

      # 실제 레포에서는 `docker inspect --format='{{index .RepoDigests 0}}'` 로 OCI digest를 뽑는다.
      # 이 샌드박스는 레지스트리가 없으므로 산출물(jar)의 sha256 을 같은 역할로 쓴다.
      # build.gradle 에서 타임스탬프/파일순서를 고정해 뒀기 때문에 "같은 소스 = 같은 digest" 가 성립한다.
      - name: 산출물 digest 산출
        id: artifact
        run: |
          JAR=$(ls build/libs/*.jar | head -1)
          DIGEST="sha256:$(sha256sum "$JAR" | cut -d' ' -f1)"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "jar=${JAR}"       >> "$GITHUB_OUTPUT"
          echo "$JAR -> $DIGEST"

      # ★ 배포 원장 ★ — annotated 태그의 메시지에 "무엇이 어디에 나갔나"를 통째로 적는다.
      #   Actions 로그는 90일이면 사라지지만 git 태그는 영구적이다.
      #   조회: git show uat-v1.1.0-rc.1  /  git tag -l 'uat-v*'  /  git tag --contains <sha>
      - name: UAT 배포 태그 부착
        env:
          TAG: ${{ steps.rc.outputs.rc_tag }}
          VERSION: ${{ steps.rc.outputs.version }}
          IMAGE_TAG: ${{ steps.rc.outputs.image_tag }}
          DIGEST: ${{ steps.artifact.outputs.digest }}
          JDK: ${{ steps.buildenv.outputs.jdk }}
          GRADLE: ${{ steps.buildenv.outputs.gradle }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" "$GITHUB_SHA" -F - <<EOF
          UAT deploy — ${VERSION} (rc)

          env      : uat
          branch   : ${GITHUB_REF_NAME}
          commit   : ${GITHUB_SHA}
          image    : ti-server:${IMAGE_TAG}
          digest   : ${DIGEST}
          jdk      : ${JDK}
          gradle   : ${GRADLE}
          run      : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          by       : ${GITHUB_ACTOR}

          주의: 이 버전은 예보(forecast)다. 재조립으로 범위가 바뀌면 실제 prod 버전이 달라질 수 있고,
          그 불일치는 prod 배포 요약에서 경고로 드러난다.
          EOF

          git push origin "$TAG"
          echo "::notice title=UAT 배포 태그::${TAG} → ${DIGEST}"

      # dummy 배포: 실제로는 컨테이너에 환경변수를 주입한다(compose environment:).
      # 버전을 산출물에 굽지 않고 주입하기 때문에, 같은 산출물이 uat/prod 어디서든 자기 자리를 안다.
      - name: Deploy (dummy) — 주입 실행
        id: run
        env:
          APP_ENV: uat
          APP_VERSION: ${{ steps.rc.outputs.version }}
          APP_COMMIT: ${{ github.sha }}
          APP_DIGEST: ${{ steps.artifact.outputs.digest }}
        run: |
          {
            echo 'APP_OUTPUT<<__EOF__'
            java -cp build/classes/java/main:build/resources/main com.ti.Main
            echo '__EOF__'
          } >> "$GITHUB_ENV"

      - name: Step summary
        env:
          TAG: ${{ steps.rc.outputs.rc_tag }}
          VERSION: ${{ steps.rc.outputs.version }}
          IMAGE_TAG: ${{ steps.rc.outputs.image_tag }}
          DIGEST: ${{ steps.artifact.outputs.digest }}
          JDK: ${{ steps.buildenv.outputs.jdk }}
          GRADLE: ${{ steps.buildenv.outputs.gradle }}
        run: |
          {
            echo "## 🟠 UAT 배포 (dummy) — \`${VERSION}\` 후보"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| 예측 버전 | \`${VERSION}\` ← prod에 나가면 이 번호가 된다 (예보) |"
            echo "| rc 태그 | \`${TAG}\` ← **영구 기록.** \`git show ${TAG}\` |"
            echo "| 이미지 태그 | \`ti-server:${IMAGE_TAG}\` |"
            echo "| digest | \`${DIGEST}\` |"
            echo "| 소스 브랜치 | \`${GITHUB_REF_NAME}\` |"
            echo "| 커밋 | [\`${GITHUB_SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |"
            echo "| 배포자 | @${GITHUB_ACTOR} |"
            echo "| 빌드 JDK | \`${JDK}\` ← **고정하지 않는다.** prod 와 다르면 digest 불일치의 원인 후보 |"
            echo "| Gradle | \`${GRADLE}\` |"
            echo ""
            echo "### 실행 중인 앱이 스스로 답하는 값"
            echo "> 실제 레포의 \`/actuator/info\` 에 해당. 버전은 굽지 않고 주입되므로 산출물은 그대로다."
            echo '```'
            echo "${APP_OUTPUT}"
            echo '```'
            echo ""
            echo "### UAT에 올라간 배포 후보 (master 대비)"
            echo '```'
            git log --merges --oneline "${GITHUB_SHA}" --not origin/master || echo "(단건 fast path — merge 없음)"
            echo '```'
            echo ""
            echo "### 변경 로그 (직전 릴리스 이후)"
            echo '```'
            echo "${{ steps.changelog.outputs.clean_changelog }}"
            echo '```'
            echo "> 이 digest 를 기록해 두라. prod 배포 요약이 같은 값을 내면 **UAT에서 검증한 산출물이 그대로 나간 것**이다."
          } >> "$GITHUB_STEP_SUMMARY"
