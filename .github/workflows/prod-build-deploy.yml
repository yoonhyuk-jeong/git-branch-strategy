# v4 12절: prod = pull_request closed(merged) 자동 + concurrency group
#   master에는 dispatch를 붙이지 않는다 — UAT가 진짜 게이트이고, 검증한 소스가 그대로 prod로 간다.
#   PR 1건 = 배포 1회. 그래서 묶음 배포는 조립 PR 1건이 기본 (feature별 PR을 따로 merge하면 배포가 N회 돈다).
# 샌드박스용 더미 — 실제 배포 없이 build + 버전 발급 + 태그/Release 부착만 한다.
#
# ── 버전 관리 규칙 (PROD) ───────────────────────────────────────────────
# 여기가 **버전이 실제로 발급되는 유일한 곳**이다.
#   1) conventional-changelog-action 이 직전 v* 태그 이후 커밋을 보고 다음 버전을 정한다
#   2) master tip(= 이번 merge commit)에 annotated 태그 `v{version}` 을 붙인다
#   3) version.yml / CHANGELOG.md 를 갱신한 chore(release) 커밋을 **태그 뒤에** 남긴다
#      → 태그는 "빌드된 커밋"을 가리키고, 뒤처리 커밋은 산출물에 영향을 주지 않는다
#   4) UAT에서 예보했던 rc 버전·digest 와 대조해 불일치면 경고를 띄운다
name: Prod build & Deploy (dummy)

on:
  pull_request:
    branches:
      - 'master'
    types: [closed]

# 태그/커밋 push + Release 생성
permissions:
  contents: write

# v4 12절 필수: 연속 merge 시 Blue-Green 중첩 방지 (이전 인스턴스 미종료 이슈와 직결).
# cancel-in-progress: false — 앞선 배포를 죽이지 않고 줄을 세운다.
concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  release:
    # merge 없이 그냥 닫힌 PR은 배포하지 않는다
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.changelog.outputs.version }}
      skipped: ${{ steps.changelog.outputs.skipped }}
      changelog: ${{ steps.changelog.outputs.clean_changelog }}
      build_sha: ${{ steps.base.outputs.sha }}
      image_tag: ${{ steps.image.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master        # 태그/커밋을 master에 push해야 하므로 detached가 아닌 브랜치로 받는다
          fetch-depth: 0     # 태그 전체가 있어야 버전 계산이 맞는다

      # v4 금지 규칙 8 증적: master tip이 정말 merge commit인지 부모 수로 검증한다.
      # 부모가 1개면 Squash/Rebase merge 또는 FF — same-SHA 원칙이 깨진 상태다.
      - name: Guard — Merge Commit 여부 검증
        run: |
          PARENTS=$(git rev-list --parents -n 1 HEAD | wc -w)
          if [ "$PARENTS" -ge 3 ]; then
            echo "✅ merge commit (부모 $((PARENTS - 1))개) — same-SHA 유지"
          else
            echo "::warning title=Squash 의심::master tip의 부모가 1개입니다. Squash/Rebase merge 또는 FF로 보입니다 (v4 금지 규칙 8). GitHub 설정에서 Squash/Rebase merge 비활성 여부를 확인하세요."
          fi

      # 태그가 붙고 실제로 빌드될 커밋을 여기서 확정한다.
      # chore(release) 커밋은 이 뒤에 붙으므로 산출물에 들어가지 않는다 → digest가 UAT와 같아질 수 있다.
      - name: 빌드 대상 커밋 확정
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install changelog config dependencies
        # v8부터 ESM 전용으로 전환되어 require()가 실패하므로, CommonJS를 지원하는 마지막 버전(7.0.2)으로 고정한다.
        run: npm install --no-save conventional-changelog-conventionalcommits@7.0.2

      # skip-commit: true → 액션은 version-file 대신 git 태그로 현재 버전을 판정한다(UAT와 동일 규칙).
      # skip-tag 는 지정하지 않는다 → 액션이 HEAD(= 위에서 확정한 커밋)에 annotated 태그를 만든다.
      - name: 릴리스 버전 발급
        id: changelog
        uses: TriPSs/conventional-changelog-action@v3
        with:
          skip-commit: 'true'      # 커밋은 아래에서 직접 (version.yml 주석 보존을 위해)
          git-push: 'false'        # push도 직접 (--follow-tags 로 태그와 함께)
          output-file: 'false'     # CHANGELOG 파일 갱신도 직접
          skip-git-pull: 'true'
          fallback-version: '1.0.0'
          config-file-path: .github/changelog-config.cjs

      - name: version.yml / CHANGELOG.md 갱신
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
          CHANGES: ${{ steps.changelog.outputs.clean_changelog }}
        run: |
          # version 줄만 치환한다. `echo > version.yml` 로 통째 덮어쓰면 파일의 주석이 날아간다.
          sed -i -E "s|^version:[[:space:]]*.*|version: ${VERSION}|" version.yml
          grep -E '^version:' version.yml

          printf '%s\n' "$CHANGES" > /tmp/new_changes.md
          if [ -f CHANGELOG.md ]; then
            cat /tmp/new_changes.md CHANGELOG.md > /tmp/changelog.md
          else
            cp /tmp/new_changes.md /tmp/changelog.md
          fi
          mv /tmp/changelog.md CHANGELOG.md

      - name: chore(release) 커밋 & 태그 push
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.yml CHANGELOG.md
          git commit -m "chore(release): v${VERSION} [skip ci]"
          # --follow-tags: 위 액션이 만든 annotated 태그 v{version} 을 커밋과 함께 push한다.
          # 태그는 merge commit 을, 이 커밋은 그 뒤를 가리킨다.
          git push --follow-tags origin master

      - name: 이미지 태그 결정
        id: image
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
          SKIPPED: ${{ steps.changelog.outputs.skipped }}
        run: |
          # 릴리스 대상 커밋이 없으면(문서만 바뀐 merge 등) 버전이 비어 있다. 그래도 배포는 돌아야 한다.
          if [ "$SKIPPED" = "false" ] && [ -n "$VERSION" ]; then
            TAG="v$VERSION"
          else
            TAG="sha-$(echo "${{ steps.base.outputs.sha }}" | cut -c1-7)"
            echo "::notice title=버전 없음::릴리스 스킵(skipped=$SKIPPED) — $TAG 로 배포한다"
          fi
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"

  deploy:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (빌드 대상 커밋)
        uses: actions/checkout@v4
        with:
          # chore(release) 커밋이 아니라 **태그가 붙은 merge commit** 을 빌드한다.
          # 그래야 UAT가 빌드한 트리와 같아지고 digest 비교가 성립한다.
          ref: ${{ needs.release.outputs.build_sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'

      # ── 빌드 환경 기록 ────────────────────────────────────────────────
      # JDK 를 고정하지 않는다. `java-version: '17'` 은 최신 패치로 해석되므로 실행 시점마다
      # 달라질 수 있고, 그건 CVE 패치를 계속 받기 위해 의도한 것이다.
      # 대신 무엇으로 빌드했는지를 남긴다 — digest 가 어긋났을 때 "JDK가 움직였나 / 소스가
      # 다른가"를 즉시 구분하기 위한 증적이다. 고정(prevention)이 아니라 감지(detection).
      - name: 빌드 환경 기록
        id: buildenv
        run: |
          VENDOR=$(java -XshowSettings:properties -version 2>&1 | grep -m1 'java.vendor =' | sed 's/.*= *//')
          BUILD=$(java -version 2>&1 | sed -n '2p' | sed -E 's/.*\(build ([^)]*)\).*/\1/')
          GRADLE=$(sed -n 's|.*gradle-\([0-9.]*\)-bin.zip|\1|p' gradle/wrapper/gradle-wrapper.properties)
          echo "jdk=${VENDOR} ${BUILD}" >> "$GITHUB_OUTPUT"
          echo "gradle=${GRADLE}"       >> "$GITHUB_OUTPUT"
          echo "JDK: ${VENDOR} ${BUILD} / Gradle: ${GRADLE}"

      - name: Build
        run: ./gradlew build --no-daemon

      - name: 산출물 digest 산출
        id: artifact
        run: |
          JAR=$(ls build/libs/*.jar | head -1)
          DIGEST="sha256:$(sha256sum "$JAR" | cut -d' ' -f1)"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "$JAR -> $DIGEST"

      # ★ 목표의 핵심 ★ — "UAT에서 검증한 그 산출물이 그대로 나갔는가"를 digest로 증명한다.
      # uat-v* 태그의 메시지에 digest가 적혀 있으므로, 그걸 훑어 같은 값을 찾는다.
      # ★ 목표의 핵심 ★ — "UAT에서 검증한 그 산출물이 그대로 나갔는가"를 digest로 증명한다.
      # uat-v* 태그의 메시지에 digest/jdk/commit 이 적혀 있으므로, 그걸 훑어 대조한다.
      # 어긋났을 때는 기록해 둔 값들을 비교해 **무엇이 움직였는지**까지 지목한다.
      - name: UAT 대조 (digest 동일성 / 불일치 원인 진단)
        id: verify
        env:
          DIGEST: ${{ steps.artifact.outputs.digest }}
          VERSION: ${{ needs.release.outputs.version }}
          BUILD_SHA: ${{ needs.release.outputs.build_sha }}
          JDK: ${{ steps.buildenv.outputs.jdk }}
        run: |
          git fetch --tags --force --quiet
          git tag -l 'uat-v*' > /tmp/uat_tags.txt || true

          # annotated 태그 메시지에서 "키 : 값" 한 줄 뽑기
          field() { git for-each-ref --format='%(contents)' "refs/tags/$1" \
                     | sed -n "s/^$2[[:space:]]*:[[:space:]]*//p" | head -1; }

          MATCH=""
          # 파이프 대신 파일 리다이렉션 — 파이프면 while이 서브셸에서 돌아 MATCH가 사라진다
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            if [ "$(field "$t" digest)" = "$DIGEST" ]; then MATCH="$t"; break; fi
          done < /tmp/uat_tags.txt

          # 같은 버전으로 UAT에 올렸던 가장 최근 rc — digest가 어긋났을 때의 비교 대상
          CAND=$(git tag -l "uat-v${VERSION}-rc.*" --sort=-creatordate | head -1)

          if [ -n "$MATCH" ]; then
            FORECAST=$(echo "$MATCH" | sed -E 's|^uat-v(.*)-rc\.[0-9]+$|\1|')
            echo "matched_tag=$MATCH" >> "$GITHUB_OUTPUT"
            echo "cause="             >> "$GITHUB_OUTPUT"
            echo "✅ digest 일치 — UAT($MATCH)에서 검증한 산출물이 그대로 나간다"
            if [ -n "$VERSION" ] && [ "$FORECAST" != "$VERSION" ]; then
              echo "::warning title=버전 예보 불일치::UAT는 $FORECAST 로 예보했으나 실제 발급은 $VERSION 입니다. 재조립으로 배포 범위가 바뀐 것으로 보입니다."
              echo "version_match=false" >> "$GITHUB_OUTPUT"
            else
              echo "version_match=true"  >> "$GITHUB_OUTPUT"
            fi
          else
            echo "matched_tag="     >> "$GITHUB_OUTPUT"
            echo "version_match=na" >> "$GITHUB_OUTPUT"
            CAUSE=""
            if [ -n "$CAND" ]; then
              U_JDK=$(field "$CAND" jdk)
              U_TREE=$(git rev-parse "${CAND}^{tree}" 2>/dev/null || echo "")
              P_TREE=$(git rev-parse "${BUILD_SHA}^{tree}")
              # 기록해 둔 값들을 하나씩 대조해 원인을 좁힌다 (고정 대신 감지를 택한 이유)
              if [ -n "$U_TREE" ] && [ "$U_TREE" != "$P_TREE" ]; then
                CAUSE="소스 트리가 다르다 (UAT ${U_TREE:0:12} vs PROD ${P_TREE:0:12}) — 조립 이후 코드가 바뀌었다"
              elif [ -n "$U_JDK" ] && [ "$U_JDK" != "$JDK" ]; then
                CAUSE="빌드 JDK가 움직였다 (UAT: $U_JDK / PROD: $JDK) — 소스는 동일"
              else
                CAUSE="기록된 입력(트리·JDK)은 모두 같다 — 기록하지 않은 변수가 움직였다"
              fi
              echo "::warning title=digest 불일치::$CAND 와 산출물이 다릅니다. 원인: $CAUSE"
            else
              CAUSE="이 버전으로 UAT에 올린 기록이 없다 — UAT 미경유 (v4 금지규칙 7)"
              echo "::warning title=UAT 기록 없음::$CAUSE"
            fi
            echo "cause=$CAUSE" >> "$GITHUB_OUTPUT"
            echo "candidate=$CAND" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy (dummy) — 주입 실행
        env:
          APP_ENV: prod
          APP_VERSION: ${{ needs.release.outputs.image_tag }}
          APP_COMMIT: ${{ needs.release.outputs.build_sha }}
          APP_DIGEST: ${{ steps.artifact.outputs.digest }}
        run: |
          {
            echo 'APP_OUTPUT<<__EOF__'
            java -cp build/classes/java/main:build/resources/main com.ti.Main
            echo '__EOF__'
          } >> "$GITHUB_ENV"

      # 태그와 짝을 이루는 영구 기록. 태그는 git 안에, Release는 GitHub UI에 남는다.
      - name: GitHub Release 생성
        if: ${{ needs.release.outputs.skipped == 'false' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.release.outputs.version }}
          name: v${{ needs.release.outputs.version }}
          body: |
            ${{ needs.release.outputs.changelog }}

            ---
            **배포 증적**

            | | |
            |---|---|
            | 이미지 태그 | `ti-server:${{ needs.release.outputs.image_tag }}` |
            | digest | `${{ steps.artifact.outputs.digest }}` |
            | 빌드 커밋 | `${{ needs.release.outputs.build_sha }}` |
            | 빌드 JDK | `${{ steps.buildenv.outputs.jdk }}` |
            | UAT 대조 | `${{ steps.verify.outputs.matched_tag || 'MISS — UAT 기록 없음' }}` |
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Step summary
        env:
          VERSION: ${{ needs.release.outputs.version }}
          IMAGE_TAG: ${{ needs.release.outputs.image_tag }}
          DIGEST: ${{ steps.artifact.outputs.digest }}
          MATCHED: ${{ steps.verify.outputs.matched_tag }}
          VMATCH: ${{ steps.verify.outputs.version_match }}
          CAUSE: ${{ steps.verify.outputs.cause }}
          CANDIDATE: ${{ steps.verify.outputs.candidate }}
          BUILD_SHA: ${{ needs.release.outputs.build_sha }}
          JDK: ${{ steps.buildenv.outputs.jdk }}
          GRADLE: ${{ steps.buildenv.outputs.gradle }}
        run: |
          if [ -n "$MATCHED" ]; then
            if [ "$VMATCH" = "true" ]; then
              VERDICT="✅ \`${MATCHED}\` 와 digest 동일 — **UAT에서 검증한 산출물이 그대로 나갔다**"
            else
              VERDICT="⚠️ \`${MATCHED}\` 와 digest는 같으나 **버전 예보가 빗나갔다** (재조립 정황)"
            fi
          else
            VERDICT="❌ 같은 digest의 UAT 기록 없음${CANDIDATE:+ — 대조 대상 \`${CANDIDATE}\`}"
          fi
          {
            echo "## 🔴 PROD 배포 (dummy) — \`${IMAGE_TAG}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| 발급 버전 | \`${VERSION:-(스킵)}\` |"
            echo "| 이미지 태그 | \`ti-server:${IMAGE_TAG}\` ← **다시 움직이지 않는다** |"
            echo "| digest | \`${DIGEST}\` |"
            echo "| 빌드 커밋 | [\`${BUILD_SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${BUILD_SHA}) |"
            echo "| PR | #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }} |"
            echo "| 배포자 | @${GITHUB_ACTOR} |"
            echo "| 빌드 JDK | \`${JDK}\` ← 고정하지 않고 기록만 한다 |"
            echo "| Gradle | \`${GRADLE}\` |"
            echo ""
            echo "### UAT 대조"
            echo "${VERDICT}"
            if [ -n "$CAUSE" ]; then
              echo ""
              echo "> **원인:** ${CAUSE}"
              echo ">"
              echo "> JDK를 고정하지 않고 **기록**하기 때문에, 불일치가 났을 때 어느 입력이 움직였는지 여기서 바로 지목된다."
            fi
            echo ""
            echo "### 실행 중인 앱이 스스로 답하는 값"
            echo '```'
            echo "${APP_OUTPUT}"
            echo '```'
            echo ""
            echo "### 이번 배포로 master에 들어온 것"
            echo '```'
            git log --oneline -10 "${BUILD_SHA}"
            echo '```'
            echo ""
            echo "### 열려 있는 release 브랜치 (사후 정리 대상)"
            echo '```'
            git branch -r --list 'origin/release-*' || echo "(없음)"
            echo '```'
            echo "> 배포 후: master를 열린 test / dev 에 forward merge → 끝난 release 삭제 → 반영된 feature 삭제 (v4 5단계)"
          } >> "$GITHUB_STEP_SUMMARY"
