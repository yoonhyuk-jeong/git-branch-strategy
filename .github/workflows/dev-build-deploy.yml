# v4 12절: dev = push 자동 (현행 유지)
# 샌드박스용 더미 — 실제 배포 없이 build + 산출물 식별자 출력만 한다.
#
# ── 버전 관리 규칙 (DEV/TEST) ───────────────────────────────────────────
# dev / test 에는 **릴리스 버전을 발급하지 않는다.** 버전이 존재하는 곳은 두 군데뿐이다:
#   · uat  = 예보(forecast)  → uat-v{version}-rc.{n}
#   · prod = 발급(issue)     → v{version}
# dev/test 는 "무슨 버전이냐"가 아니라 "무슨 기능이 들어 있느냐"로 읽는 곳이다(v4 브랜치=칸반).
# 그래서 식별자는 커밋 SHA 하나로 충분하다.
name: Dev build & Deploy (dummy)

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'gradle'

      # ── 빌드 환경 기록 ────────────────────────────────────────────────
      # JDK 를 고정하지 않는다. `java-version: '17'` 은 최신 패치로 해석되므로 실행 시점마다
      # 달라질 수 있고, 그건 CVE 패치를 계속 받기 위해 의도한 것이다.
      # 대신 무엇으로 빌드했는지를 남긴다 — digest 가 어긋났을 때 "JDK가 움직였나 / 소스가
      # 다른가"를 즉시 구분하기 위한 증적이다. 고정(prevention)이 아니라 감지(detection).
      - name: 빌드 환경 기록
        id: buildenv
        run: |
          VENDOR=$(java -XshowSettings:properties -version 2>&1 | grep -m1 'java.vendor =' | sed 's/.*= *//')
          BUILD=$(java -version 2>&1 | sed -n '2p' | sed -E 's/.*\(build ([^)]*)\).*/\1/')
          GRADLE=$(sed -n 's|.*gradle-\([0-9.]*\)-bin.zip|\1|p' gradle/wrapper/gradle-wrapper.properties)
          echo "jdk=${VENDOR} ${BUILD}" >> "$GITHUB_OUTPUT"
          echo "gradle=${GRADLE}"       >> "$GITHUB_OUTPUT"
          echo "JDK: ${VENDOR} ${BUILD} / Gradle: ${GRADLE}"

      - name: Build
        run: ./gradlew build --no-daemon

      - name: 산출물 digest 산출
        id: artifact
        run: |
          JAR=$(ls build/libs/*.jar | head -1)
          echo "digest=sha256:$(sha256sum "$JAR" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Deploy (dummy) — 주입 실행
        env:
          APP_ENV: dev
          APP_VERSION: sha-${{ github.sha }}
          APP_COMMIT: ${{ github.sha }}
          APP_DIGEST: ${{ steps.artifact.outputs.digest }}
        run: |
          {
            echo 'APP_OUTPUT<<__EOF__'
            java -cp build/classes/java/main:build/resources/main com.ti.Main
            echo '__EOF__'
          } >> "$GITHUB_ENV"

      - name: Step summary
        env:
          DIGEST: ${{ steps.artifact.outputs.digest }}
          JDK: ${{ steps.buildenv.outputs.jdk }}
        run: |
          echo "::notice title=DEV deploy::env=dev ref=${GITHUB_REF_NAME} image=ti-server:sha-${GITHUB_SHA::7} digest=${DIGEST}"
          {
            echo "## 🟢 DEV 배포 (dummy) — 연동 놀이터"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| 트리거 | \`push\` (자동) |"
            echo "| 이미지 태그 | \`ti-server:sha-${GITHUB_SHA::7}\` — **버전 없음** (dev/test는 릴리스 대상이 아니다) |"
            echo "| digest | \`${DIGEST}\` |"
            echo "| 커밋 | [\`${GITHUB_SHA:0:7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |"
            echo "| 빌드 JDK | \`${JDK}\` |"
            echo ""
            echo "### 실행 중인 앱"
            echo '```'
            echo "${APP_OUTPUT}"
            echo '```'
            echo ""
            echo "### dev에 들어있는 기능 (master 대비)"
            echo '```'
            git log --merges --oneline "${GITHUB_SHA}" --not origin/master || echo "(master 대비 추가 merge 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
