plugins {
    id 'java'
}

group = 'com.ti'

// 버전은 version.yml 하나에서만 읽는다 (prod 워크플로가 갱신하는 파일).
// build.gradle 에 숫자를 직접 박으면 두 곳이 갈라진다.
version = (file('version.yml').text =~ /(?m)^version:\s*(\S+)/)[0][1]

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

// version.yml 을 jar 안에 넣어, 실행 중인 앱이 "빌드 시점 버전"을 알 수 있게 한다.
// 단 이건 fallback 이다 — 실제 배포 버전은 실행 시 APP_VERSION 으로 주입한다 (Version.java 참고).
processResources {
    from('version.yml')
}

// digest 재현성: 산출물 바이트가 소스에만 의존하도록 타임스탬프/파일순서를 고정한다.
// 이게 있어야 "같은 소스 = 같은 digest" 가 성립하고, UAT 에서 검증한 것이 prod 에 그대로
// 나갔는지를 digest 비교로 증명할 수 있다.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

test {
    useJUnitPlatform()
}
